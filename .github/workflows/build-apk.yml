name: Build debug APK

# Builds an installable debug APK on every push, and lets you trigger it manually from the
# Actions tab too. This exists because building an Android app needs full internet access to
# Google's and Maven Central's package repositories, which not every environment has - GitHub's
# own runners always do, so this is a zero-local-setup way to get a real APK out of this
# project.
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub's ubuntu-latest runners already have a working Android SDK + sdkmanager
      # preinstalled, so we use that directly rather than a third-party "set up Android SDK"
      # action - at the time this was written, android-actions/setup-android@v3 replaces the
      # preinstalled (modern) cmdline-tools with an old downloaded one that tries to install
      # Google's long-removed legacy "tools" package and fails with "Failed to find package
      # 'tools'". Accepting licenses and installing only the exact packages this project needs
      # avoids that entirely.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install required Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
