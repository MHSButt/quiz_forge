name: Build debug APK

# Builds an installable debug APK on every push, and lets you trigger it manually from the
# Actions tab too. This exists because building an Android app needs full internet access to
# Google's and Maven Central's package repositories, which not every environment has - GitHub's
# own runners always do, so this is a zero-local-setup way to get a real APK out of this
# project.
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
